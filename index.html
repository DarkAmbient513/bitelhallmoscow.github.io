<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Концерт — Билеты</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
    body {background:#0f0f0f; color:white;}

    header {
      padding:40px 20px;
      text-align:center;
      background:linear-gradient(135deg,#1a1a1a,#000);
    }

    h1 {font-size:2.5rem; margin-bottom:10px;}

    .info {opacity:0.8; margin-bottom:20px;}

    .container {padding:20px; max-width:900px; margin:auto;}

    .card {
      background:#1c1c1c;
      border-radius:16px;
      padding:20px;
      margin-bottom:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    .price {font-size:1.5rem; margin:10px 0;}

    button {
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:#ff3b3b;
      color:white;
      cursor:pointer;
      font-size:1rem;
      transition:0.2s;
    }

    button:hover {background:#ff1a1a;}

    .success {
      display:none;
      text-align:center;
      padding:20px;
      background:#1e7e34;
      border-radius:10px;
      margin-top:20px;
    }

    @media(max-width:600px){
      h1 {font-size:1.8rem;}
    }
  </style>
</head>
<body>

<header>
  <h1>🔥 ЖИВОЙ КОНЦЕРТ 🔥</h1>
  <div class="info">Москва • 16:00 • просп. Андропова, 1</div>
</header>

<div class="container">

  <div class="card">
    <h2>Обычный билет</h2>
    <div class="price">500 ₽</div>
    <button onclick="buyTicket('Обычный')">Купить</button>
  </div>

  <div class="card">
    <h2>VIP билет</h2>
    <div class="price">1500 ₽</div>
    <button onclick="buyTicket('VIP')">Купить</button>
  </div>

  <div class="card">
    <h2>Meet & Greet</h2>
    <div class="price">3000 ₽</div>
    <button onclick="buyTicket('Meet & Greet')">Купить</button>
  </div>

  <div id="success" class="success"></div>

</div>

<script>
function buyTicket(type){
  const success = document.getElementById('success');
  success.style.display = 'block';
  success.innerHTML = `🎟 Вы купили билет: <b>${type}</b><br>Ожидайте письмо с подтверждением 😉`;

  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}
</script>

</body>
</html>
