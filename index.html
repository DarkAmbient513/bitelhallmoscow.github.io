<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moscow Hall — Билеты</title>

<style>
:root{
  --bg:#0b0b0f;
  --card:#15151d;
  --accent:#ff2e63;
  --text:#ffffff;
  --muted:#9aa0a6;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:"Inter",Arial,sans-serif}
body{background:var(--bg);color:var(--text)}

header{
  padding:30px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
}

.logo{font-size:1.4rem;font-weight:700}

.hero{
  padding:60px 20px;
  text-align:center;
  background:linear-gradient(180deg,#111,#0b0b0f);
}

.hero h1{font-size:2.8rem;margin-bottom:10px}
.hero p{color:var(--muted)}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
  transition:0.2s;
}

.card:hover{transform:translateY(-5px)}

.price{font-size:1.8rem;margin:15px 0}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-size:1rem;
  cursor:pointer;
}

button:hover{opacity:0.9}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#111;
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:400px;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  background:#1c1c25;
  color:white;
}

.success{
  display:none;
  text-align:center;
  padding:40px;
}

.timer{
  margin-top:20px;
  color:#ffb3b3;
}

footer{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:600px){
  .hero h1{font-size:2rem}
}
</style>
</head>
<body>

<header>
  <div class="logo">MOSCOW HALL</div>
  <div>Билеты онлайн</div>
</header>

<section class="hero">
  <h1>ЖИВОЙ КОНЦЕРТ</h1>
  <p>Москва • 16:00 • просп. Андропова, 1</p>
  <div class="timer" id="timer"></div>
</section>

<div class="container">
  <div class="grid">

    <div class="card">
      <h2>Стандарт</h2>
      <div class="price">700 ₽</div>
      <button onclick="openModal('Стандарт')">Купить билет</button>
    </div>

    <div class="card">
      <h2>VIP</h2>
      <div class="price">1900 ₽</div>
      <button onclick="openModal('VIP')">Купить билет</button>
    </div>

    <div class="card">
      <h2>Backstage</h2>
      <div class="price">3500 ₽</div>
      <button onclick="openModal('Backstage')">Купить билет</button>
    </div>

  </div>

  <div class="success" id="success"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2>Оплата</h2>
    <input placeholder="Имя">
    <input placeholder="Номер карты">
    <input placeholder="MM/YY">
    <input placeholder="CVC">
    <button onclick="pay()">Оплатить</button>
  </div>
</div>

<footer>
  © Moscow Hall • Все права защищены
</footer>

<script>
let selected = '';

function openModal(type){
  selected = type;
  document.getElementById('modal').style.display='flex';
}

function pay(){
  document.getElementById('modal').style.display='none';
  const el = document.getElementById('success');
  el.style.display='block';
  el.innerHTML = `\n    <h2>✅ Оплата прошла</h2>\n    <p>Билет: ${selected}</p>\n    <p>Отправлен на почту</p>\n  `;

  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

// Таймер (создаёт ощущение срочности)
let time = 600;
setInterval(()=>{
  let m = Math.floor(time/60);
  let s = time%60;
  document.getElementById('timer').innerText = `Осталось билетов: ${Math.max(1,Math.floor(time/30))} • Таймер: ${m}:${s<10?'0'+s:s}`;
  if(time>0) time--;
},1000);
</script>

</body>
</html>
